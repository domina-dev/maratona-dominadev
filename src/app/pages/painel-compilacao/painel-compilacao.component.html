<div class="container">
    <div class="row">
        <div class="col-sm-6">
            <mat-card class="example-card">
                <mat-card-content style="display: flex; align-items: center; justify-content: center;">
                    <ngx-charts-bar-vertical [view]="view" [results]="dadosAlunos" [gradient]="gradient"
                        [xAxis]="showXAxis" [yAxis]="showYAxis" [legend]="showLegend" [showXAxisLabel]="showXAxisLabel"
                        [showYAxisLabel]="showYAxisLabel" [xAxisLabel]="xAxisLabel" [yAxisLabel]="yAxisLabel">
                    </ngx-charts-bar-vertical>
                </mat-card-content>
            </mat-card>
        </div>
        <div class="col-sm-6">
            <mat-card class="example-card">
                <mat-card-content>
                    <div class="row">
                        <div class="col">
                            <mat-form-field fxFlex="grow" appearance="outline">
                                <mat-label>Filter</mat-label>
                                <input matInput (keyup)="applyFilter($event)" placeholder="Ex. nomeFuncao" #input>
                            </mat-form-field>
                        </div>
                        <div class="col">
                            <mat-form-field fxFlex="grow" appearance="outline">
                                <mat-label>Quem está codando?</mat-label>
                                <mat-select [(ngModel)]="usuarioSelecionado" (selectionChange)="obterFuncoesPorAluno()"
                                    [disabled]="!usuarioAtual">
                                    <mat-option *ngFor="let aluno of alunos" [value]="aluno.nome">
                                        {{aluno.nome}}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                        <div class="col">
                            <button class="add-buttom" (click)="abrirCadastrar()" mat-raised-button
                                [disabled]="!usuarioAtual || usuarioAtual !== usuarioSelecionado && usuarioAtual !== 'vitorfiler'">
                                <mat-icon style="color: white;">add</mat-icon>
                            </button>
                        </div>
                    </div>

                    <div class="mat-elevation-z8">
                        <table aria-label="" mat-table [dataSource]="dataSource" matSort>

                            <ng-container matColumnDef="funcao">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Função </th>
                                <td mat-cell *matCellDef="let row"> {{row.funcao}} </td>
                            </ng-container>

                            <ng-container matColumnDef="status">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Status Execução </th>
                                <td mat-cell *matCellDef="let row">
                                    <button mat-raised-button 
                                            [style.background-color]="getStatusColor(row.status)" 
                                            class="status-button" 
                                            (click)="abrirMudarStatus(row)" 
                                            [disabled]="!podeAlterarStatus(row)">
                                        <mat-icon style="margin-right: 5px;">{{row.icone}}</mat-icon>
                                        <span>{{row.status}}</span>
                                    </button>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="executar">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header></th>
                                <td mat-cell *matCellDef="let row">
                                    <button class="executar-button" (click)="execucaoDinamica(row)" mat-raised-button>
                                        Executar
                                        <mat-icon color="primary">play_circle_outline</mat-icon>
                                    </button>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="parametros">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header class="params-column"> params
                                </th>
                                <td mat-cell *matCellDef="let row" class="params-column">
                                    {{row.parametros.length}}
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="deletar">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header></th>
                                <td mat-cell *matCellDef="let row">
                                    <div class="actions-container">
                                        <button
                                            *ngIf="usuarioAtual && usuarioAtual === usuarioSelecionado || usuarioAtual === 'vitorfiler'"
                                            mat-icon-button aria-label="ícone Button" (click)="abrirEditar(row)">
                                            <mat-icon class="roxo-icon" color="primary">edit</mat-icon>
                                        </button>
                                        <button
                                            *ngIf="usuarioAtual && usuarioAtual === usuarioSelecionado || usuarioAtual === 'vitorfiler'"
                                            (click)="abrirDeletar(row)" mat-icon-button aria-label="ícone Button">
                                            <mat-icon class="red-icon" color="warn">delete</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                            <tr class="mat-row" *matNoDataRow>
                                <td class="mat-cell" colspan="4">Nenhuma função encontrada</td>
                            </tr>
                        </table>

                        <mat-paginator [pageSizeOptions]="[2]" aria-label="Select page of users">
                        </mat-paginator>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
</div>
<div class="container">
    <app-console class="console"></app-console>
</div>
